services:
  postgres:
    image: postgres:16
    container_name: nba_postgres
    environment:
      POSTGRES_USER: nba_user
      POSTGRES_PASSWORD: nba_password
      POSTGRES_DB: nba_db
    ports:
      - "5432:5432"
    volumes:
      - nba_postgres_data:/var/lib/postgresql/data
  
volumes:
  nba_postgres_data: