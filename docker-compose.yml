services:
  postgres:
    image: postgres:16
    container_name: nba_postgres
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - nba_postgres_data:/var/lib/postgresql/data
  
volumes:
  nba_postgres_data: